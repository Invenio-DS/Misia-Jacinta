<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Arepas Especiales - Misia Jacinta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            font-family: 'Arial Black', 'Arial', sans-serif;
        }

        /* Contenedor principal con tu imagen de fondo integrada desde GitHub */
        .menu-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('https://github.com/Invenio-DS/Misia-Jacinta/blob/main/Arepas-Espaciales.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Contenedor general del Grid de precios */
        .grid-precios {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-left: 2.2%;
            padding-right: 2.2%;
        }

        /* Cada fila de precios (8 columnas exactas) */
        .fila-arepas {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 100%;
            gap: 10px;
        }

        /* Posicionamiento vertical exacto sobre los recuadros amarillos */
        .fila-superior {
            margin-top: 24.3%;
        }

        .fila-inferior {
            margin-bottom: 9.3%;
        }

        /* Estilo individual para cada celda de precio en el menú */
        .precio-celda {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.05vw; /* Tipografía fluida para pantallas comerciales */
            font-weight: 900;
            color: #5c2d16; /* Marrón corporativo Misia Jacinta */
            text-align: center;
            line-height: 1.2;
        }

        /* Estilo pequeño opcional para diferenciar la moneda o etiqueta REF */
        .ref-tag {
            font-size: 0.75vw;
            opacity: 0.85;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <div class="grid-precios">
            
            <!-- FILA SUPERIOR (8 Columnas: 4 arepas x 2 tamaños cada una) -->
            <div class="fila-arepas fila-superior">
                <!-- Reina -->
                <div class="precio-celda" id="reina-med">...</div>
                <div class="precio-celda" id="reina-grd">...</div>
                <!-- Sifrina -->
                <div class="precio-celda" id="sifrina-med">...</div>
                <div class="precio-celda" id="sifrina-grd">...</div>
                <!-- Catira -->
                <div class="precio-celda" id="catira-med">...</div>
                <div class="precio-celda" id="catira-grd">...</div>
                <!-- Llanera -->
                <div class="precio-celda" id="llanera-med">...</div>
                <div class="precio-celda" id="llanera-grd">...</div>
            </div>

            <!-- FILA INFERIOR (8 Columnas: 4 arepas x 2 tamaños cada una) -->
            <div class="fila-arepas fila-inferior">
                <!-- Jamón y Queso -->
                <div class="precio-celda" id="jamon-med">...</div>
                <div class="precio-celda" id="jamon-grd">...</div>
                <!-- Pelúa -->
                <div class="precio-celda" id="pelua-med">...</div>
                <div class="precio-celda" id="pelua-grd">...</div>
                <!-- Párnil -->
                <div class="precio-celda" id="pernil-med">...</div>
                <div class="precio-celda" id="pernil-grd">...</div>
                <!-- Pabellón -->
                <div class="precio-celda" id="pabellon-med">...</div>
                <div class="precio-celda" id="pabellon-grd">...</div>
            </div>

        </div>
    </div>

    <script>
        const urlSheetsCsv = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSshcCDkIRx09zv0B5_uDj_F2C0lc4BoVt29XRyjtnEt2SsF9AQLfMz-qIsJ-TI0nfUm52cFNYBRM4z/pub?gid=1410264874&single=true&output=csv";

        async function actualizarCarteleraDigital() {
            try {
                const respuesta = await fetch(urlSheetsCsv + "&t=" + new Date().getTime());
                const textoCsv = await respuesta.text();
                
                // Parseamos las filas del archivo de Sheets
                const filas = textoCsv.split("\n").map(f => f.split(","));
                
                // Función interna para limpiar las comillas de las celdas de Sheets del formato CSV
                function limpiar(texto) {
                    return texto ? texto.replace(/"/g, '').trim() : "0,00";
                }

                // Función interna para generar la estructura visual del precio dentro del recuadro
                function generarHtmlPrecio(bs, ref) {
                    return `<div>${limpiar(bs)}</div><div class="ref-tag">$${limpiar(ref)}</div>`;
                }

                // =========================================================================
                // CORRECCIÓN: ASIGNACIÓN INDIVIDUAL POR CADA FILA RECTIFICANDO TU CSV [1]
                // =========================================================================
                
                // Fila Superior (Arepas 1 a 4) [1]
                document.getElementById('reina-med').innerHTML = generarHtmlPrecio(filas[1][3], filas[1][2]); [1]
                document.getElementById('reina-grd').innerHTML = generarHtmlPrecio(filas[1][5], filas[1][4]); [1]
                
                document.getElementById('sifrina-med').innerHTML = generarHtmlPrecio(filas[2][3], filas[2][2]); [1]
                document.getElementById('sifrina-grd').innerHTML = generarHtmlPrecio(filas[2][5], filas[2][4]); [1]
                
                document.getElementById('catira-med').innerHTML = generarHtmlPrecio(filas[3][3], filas[3][2]); [1]
                document.getElementById('catira-grd').innerHTML = generarHtmlPrecio(filas[3][5], filas[3][4]); [1]
                
                document.getElementById('llanera-med').innerHTML = generarHtmlPrecio(filas[4][3], filas[4][2]); [1]
                document.getElementById('llanera-grd').innerHTML = generarHtmlPrecio(filas[4][5], filas[4][4]); [1]

                // Fila Inferior (Arepas 5 a 8) [1]
                document.getElementById('jamon-med').innerHTML = generarHtmlPrecio(filas[5][3], filas[5][2]); [1]
                document.getElementById('jamon-grd').innerHTML = generarHtmlPrecio(filas[5][5], filas[5][4]); [1]
                
                document.getElementById('pelua-med').innerHTML = generarHtmlPrecio(filas[6][3], filas[6][2]); [1]
                document.getElementById('pelua-grd').innerHTML = generarHtmlPrecio(filas[6][5], filas[6][4]); [1]
                
                document.getElementById('pernil-med').innerHTML = generarHtmlPrecio(filas[7][3], filas[7][2]); [1]
                document.getElementById('pernil-grd').innerHTML = generarHtmlPrecio(filas[7][5], filas[7][4]); [1]
                
                document.getElementById('pabellon-med').innerHTML = generarHtmlPrecio(filas[8][3], filas[8][2]); [1]
                document.getElementById('pabellon-grd').innerHTML = generarHtmlPrecio(filas[8][5], filas[8][4]); [1]

            } catch (error) {
                console.error("Error al sincronizar con las celdas de Google Sheets:", error);
            }
        }

        actualizarCarteleraDigital();
        // Ciclo automático cada 15 minutos para refrescar montos en pantalla sin reiniciar la app
        setInterval(actualizarCarteleraDigital, 900000);
    </script>
</body>
</html>
