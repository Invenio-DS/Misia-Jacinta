<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misia Jacinta - Arepas Especiales</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Roboto Mono', monospace;
        }

        /* Canvas 16:9 ajustado a pantallas horizontales estándar */
        #tv-canvas {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* Ratio 16:9 */
            max-height: 100vh;
            max-width: 177.78vh;
            background-image: url('https://raw.githubusercontent.com/Invenio-DS/Misia-Jacinta/main/Arepas-Espaciales.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        /* Contenedor de Precios de cada Arepa */
        .arepa-slot {
            position: absolute;
            display: flex;
            justify-content: space-between;
            width: 17.5%;
            height: 6%;
            z-index: 10;
        }

        /* Bloque Mediana y Grande */
        .size-box {
            width: 48%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            line-height: 1.1;
        }

        .price-line {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.85vw;
            font-weight: 900;
        }

        .price-ref {
            color: #8a3b00;
        }

        .price-bs {
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .lbl {
            font-size: 0.6vw;
            margin-right: 2px;
            opacity: 0.9;
        }

        /* Posicionamiento Fila 1 (Superior) */
        #arepa-0 { left: 7.2%;  top: 50.5%; } /* Reina */
        #arepa-1 { left: 31.4%; top: 50.5%; } /* Sifrina */
        #arepa-2 { left: 55.6%; top: 50.5%; } /* Catira */
        #arepa-3 { left: 79.8%; top: 50.5%; } /* Llanera */

        /* Posicionamiento Fila 2 (Inferior) */
        #arepa-4 { left: 7.2%;  top: 86.5%; } /* Jamón y Queso */
        #arepa-5 { left: 31.4%; top: 86.5%; } /* Pelúa */
        #arepa-6 { left: 55.6%; top: 86.5%; } /* Pérnil */
        #arepa-7 { left: 79.8%; top: 86.5%; } /* Pabellón */

        /* Sello flotante Tasa BCV (Esquina Superior Derecha sobre el logo) */
        #bcv-badge {
            position: absolute;
            top: 4.5%;
            right: 2.2%;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #F08F00;
            border-radius: 12px;
            padding: 4px 10px;
            color: #fff;
            text-align: center;
            font-size: 0.8vw;
            font-weight: 700;
            z-index: 20;
        }

        #bcv-badge span {
            color: #F08F00;
            display: block;
            font-size: 0.6vw;
        }
    </style>
</head>
<body>

    <div id="tv-canvas">
        <!-- Badge BCV -->
        <div id="bcv-badge">
            <span>TASA BCV</span>
            <div id="val-bcv">---</div>
        </div>

        <!-- 8 Arepas x 2 Tamaños = 16 Precios en Pantalla -->
        <div class="arepa-slot" id="arepa-0">
            <div class="size-box"><div class="price-line price-ref"><span class="lbl">Ref:</span><span class="v-ref-m">...</span></div><div class="price-line price-bs"><span class="lbl">Bs.</span><span class="v-bs-m">...</span></div></div>
            <div class="size-box"><div class="price-line price-ref"><span class="lbl">Ref:</span><span class="v-ref-g">...</span></div><div class="price-line price-bs"><span class="lbl">Bs.</span><span class="v-bs-g">...</span></div></div>
        </div>
        <div class="arepa-slot" id="arepa-1">
            <div class="size-box"><div class="price-line price-ref"><span class="lbl">Ref:</span><span class="v-ref-m">...</span></div><div class="price-line price-bs"><span class="lbl">Bs.</span><span class="v-bs-m">...</span></div></div>
            <div class="size-box"><div class="price-line price-ref"><span class="lbl">Ref:</span><span class="v-ref-g">...</span></div><div class="price-line price-bs"><span class="lbl">Bs.</span><span class="v-bs-g">...</span></div></div>
        </div>
        <div class="arepa-slot" id="arepa-2">
            <div class="size-box"><div class="price-line price-ref"><span class="lbl">Ref:</span><span class="v-ref-m">...</span></div><div class="price-line price-bs"><span class="lbl">Bs.</span><span class="v-bs-m">...</span></div></div>
            <div class="size-box"><div class="price-line price-ref"><span class="lbl">Ref:</span><span class="v-ref-g">...</span></div><div class="price-line price-bs"><span class="lbl">Bs.</span><span class="v-bs-g">...</span></div></div>
        </div>
        <div class="arepa-slot" id="arepa-3">
            <div class="size-box"><div class="price-line price-ref"><span class="lbl">Ref:</span><span class="v-ref-m">...</span></div><div class="price-line price-bs"><span class="lbl">Bs.</span><span class="v-bs-m">...</span></div></div>
            <div class="size-box"><div class="price-line price-ref"><span class="lbl">Ref:</span><span class="v-ref-g">...</span></div><div class="price-line price-bs"><span class="lbl">Bs.</span><span class="v-bs-g">...</span></div></div>
        </div>
        <div class="arepa-slot" id="arepa-4">
            <div class="size-box"><div class="price-line price-ref"><span class="lbl">Ref:</span><span class="v-ref-m">...</span></div><div class="price-line price-bs"><span class="lbl">Bs.</span><span class="v-bs-m">...</span></div></div>
            <div class="size-box"><div class="price-line price-ref"><span class="lbl">Ref:</span><span class="v-ref-g">...</span></div><div class="price-line price-bs"><span class="lbl">Bs.</span><span class="v-bs-g">...</span></div></div>
        </div>
        <div class="arepa-slot" id="arepa-5">
            <div class="size-box"><div class="price-line price-ref"><span class="lbl">Ref:</span><span class="v-ref-m">...</span></div><div class="price-line price-bs"><span class="lbl">Bs.</span><span class="v-bs-m">...</span></div></div>
            <div class="size-box"><div class="price-line price-ref"><span class="lbl">Ref:</span><span class="v-ref-g">...</span></div><div class="price-line price-bs"><span class="lbl">Bs.</span><span class="v-bs-g">...</span></div></div>
        </div>
        <div class="arepa-slot" id="arepa-6">
            <div class="size-box"><div class="price-line price-ref"><span class="lbl">Ref:</span><span class="v-ref-m">...</span></div><div class="price-line price-bs"><span class="lbl">Bs.</span><span class="v-bs-m">...</span></div></div>
            <div class="size-box"><div class="price-line price-ref"><span class="lbl">Ref:</span><span class="v-ref-g">...</span></div><div class="price-line price-bs"><span class="lbl">Bs.</span><span class="v-bs-g">...</span></div></div>
        </div>
        <div class="arepa-slot" id="arepa-7">
            <div class="size-box"><div class="price-line price-ref"><span class="lbl">Ref:</span><span class="v-ref-m">...</span></div><div class="price-line price-bs"><span class="lbl">Bs.</span><span class="v-bs-m">...</span></div></div>
            <div class="size-box"><div class="price-line price-ref"><span class="lbl">Ref:</span><span class="v-ref-g">...</span></div><div class="price-line price-bs"><span class="lbl">Bs.</span><span class="v-bs-g">...</span></div></div>
        </div>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSshcCDkIRx09zv0B5_uDj_F2C0lc4BoVt29XRyjtnEt2SsF9AQLfMz-qIsJ-TI0nfUm52cFNYBRM4z/pub?gid=1410264874&single=true&output=csv";
        const SYNC_INTERVAL = 3600000;

        function parseCSVLine(line) {
            const result = [];
            let curValue = "";
            let inQuotes = false;
            for (let char of line) {
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) {
                    result.push(curValue);
                    curValue = "";
                } else curValue += char;
            }
            result.push(curValue);
            return result;
        }

        function parseCustomFloat(val) {
            if (!val) return 0;
            let str = String(val).trim();
            if (str.includes('.') && str.includes(',')) {
                str = str.replace(/\./g, '').replace(',', '.');
            } else if (str.includes(',')) {
                str = str.replace(',', '.');
            } else if (str.includes('.')) {
                const parts = str.split('.');
                if (parts[parts.length - 1].length > 2) {
                    str = str.replace(/\./g, '');
                }
            }
            let n = parseFloat(str.replace(/[^\d.-]/g, ''));
            return isNaN(n) ? 0 : n;
        }

        function formatPrice(val) {
            let n = parseCustomFloat(val);
            if (n === 0) return "0,00";
            return n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatPrice4(val) {
            let n = parseCustomFloat(val);
            if (n === 0) return "0,0000";
            return n.toLocaleString('de-DE', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
        }

        async function fetchMenuData() {
            try {
                const response = await fetch(`${CSV_URL}&t=${Date.now()}`);
                const text = await response.text();
                const lines = text.split(/\r?\n/).filter(r => r.trim() !== "");

                if (lines.length < 2) return;

                // Fila 2 de Excel = lines[1]
                for (let i = 0; i < 8; i++) {
                    const lineIdx = i + 1;
                    if (!lines[lineIdx]) break;

                    const cols = parseCSVLine(lines[lineIdx]);
                    const slot = document.getElementById(`arepa-0`.replace('0', i));
                    if (!slot) continue;

                    // Mapeo: C=2 (Ref Med), D=3 (Bs Med), E=4 (Ref Gde), F=5 (Bs Gde)
                    const refMed = formatPrice(cols[2]);
                    const bsMed  = formatPrice(cols[3]);
                    const refGde = formatPrice(cols[4]);
                    const bsGde  = formatPrice(cols[5]);

                    slot.querySelector('.v-ref-m').innerText = refMed;
                    slot.querySelector('.v-bs-m').innerText  = bsMed;
                    slot.querySelector('.v-ref-g').innerText = refGde;
                    slot.querySelector('.v-bs-g').innerText  = bsGde;
                }

                // Tasa BCV si está presente en columna G (índice 6) de la primera fila
                const firstRowCols = parseCSVLine(lines[1]);
                if (firstRowCols[6]) {
                    document.getElementById('val-bcv').innerText = formatPrice4(firstRowCols[6]);
                }

            } catch (err) {
                console.error("Error sincronizando precios:", err);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchMenuData();
            setInterval(fetchMenuData, SYNC_INTERVAL);
        });
    </script>
</body>
</html>
